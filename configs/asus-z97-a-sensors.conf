# lm-sensors configuration for ASUS Z97-A (Nuvoton NCT6791D @ 0x0290)
# Install to /etc/sensors.d/asus-z97-a.conf and ensure nct6775 is in /etc/modules-load.d/nct6775.conf

chip "nct6791-isa-0290"

    label in0 "Vcore"
    label in1 "+12V (scaled)"
    label in2 "AVCC"
    label in3 "+3.3V"
    label in4 "+5V / Aux"
    label in5 "DRAM / AUX1"
    label in7 "3VSB"
    label in8 "Vbat"

    # Unconnected voltage inputs on ASUS Z97-A
    ignore in6
    ignore in9
    ignore in10
    ignore in11
    ignore in12
    ignore in13
    ignore in14

    label fan1 "CHA_FAN2 / Opt"
    label fan2 "CPU_FAN"
    label fan3 "CHA_FAN1"
    label fan4 "CHA_FAN3"
    label fan5 "CHA_FAN4"

    label temp1 "SYSTIN (MB)"
    set temp1_max 60
    set temp1_max_hyst 55

    # Unwired thermistor / PECI shadow registers on Z97-A (CPU temp comes from coretemp)
    ignore temp2
    ignore temp3
    ignore temp4
    label temp5 "AUXTIN2 (Board)"
    ignore temp6
    ignore temp7
    ignore temp8
    ignore temp9
    ignore temp10
    ignore temp11
    ignore temp12

    ignore intrusion0
    ignore intrusion1
    ignore beep_enable
