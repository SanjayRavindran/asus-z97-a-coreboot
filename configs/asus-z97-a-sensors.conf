# lm-sensors configuration for ASUS Z97-A (Nuvoton NCT6791D @ 0x0290)
# Install to /etc/sensors.d/asus-z97-a.conf, ensure nct6775 is in /etc/modules-load.d/nct6775.conf,
# and run `sensors -s` (or `systemctl restart lm-sensors.service`).

chip "nct6791-isa-0290"

    # Voltages
    label in0 "CPU Input (VCCIN)"
    compute in0 @ * 2, @ / 2
    set in0_min 1.50
    set in0_max 2.10

    label in1 "+5V"
    compute in1 @ * 5, @ / 5
    set in1_min 5 * 0.95
    set in1_max 5 * 1.05

    label in2 "AVCC"
    set in2_min 3.3 * 0.95
    set in2_max 3.3 * 1.05

    label in3 "+3.3V"
    set in3_min 3.3 * 0.95
    set in3_max 3.3 * 1.05

    label in4 "+12V"
    compute in4 @ * 12, @ / 12
    set in4_min 12 * 0.95
    set in4_max 12 * 1.05

    label in7 "3VSB"
    set in7_min 3.3 * 0.95
    set in7_max 3.3 * 1.05

    label in8 "Vbat"
    set in8_min 2.70
    set in8_max 3.60

    # Unwired / uncalibrated analog voltage inputs on ASUS Z97-A
    ignore in5
    ignore in6
    ignore in9
    ignore in10
    ignore in11
    ignore in12
    ignore in13
    ignore in14

    # Fans (mapped to QFanDXE NCT6791D Banks 1, 2, 3, 8, 9)
    label fan1 "CHA_FAN1"
    label fan2 "CPU_FAN"
    set fan2_min 300
    label fan3 "CHA_FAN2"
    label fan4 "CHA_FAN3"
    label fan5 "CHA_FAN4"

    # PWM duty outputs (work around lm-sensors 3.6.2-2 dividing raw 0..255 by 2 -> 128%)
    label pwm1 "CHA_FAN1 PWM"
    compute pwm1 @ * 2 / 2.55, @ * 2.55 / 2
    label pwm2 "CPU_FAN PWM"
    compute pwm2 @ * 2 / 2.55, @ * 2.55 / 2
    label pwm3 "CHA_FAN2 PWM"
    compute pwm3 @ * 2 / 2.55, @ * 2.55 / 2
    label pwm4 "CHA_FAN3 PWM"
    compute pwm4 @ * 2 / 2.55, @ * 2.55 / 2
    label pwm5 "CHA_FAN4 PWM"
    compute pwm5 @ * 2 / 2.55, @ * 2.55 / 2

    # Temperatures
    label temp1 "Motherboard (SYSTIN)"
    set temp1_max 65
    set temp1_max_hyst 60

    label temp2 "CPU Socket (CPUTIN)"
    set temp2_max 80
    set temp2_max_hyst 75

    label temp5 "Board Aux (AUXTIN2)"
    label temp7 "CPU (PECI Agent 0)"

    # Floating thermistors & unpopulated PCH SMBus thermal shadows
    ignore temp3
    ignore temp4
    ignore temp6
    ignore temp8
    ignore temp9
    ignore temp10
    ignore temp11
    ignore temp12

    ignore intrusion0
    ignore intrusion1
    ignore beep_enable
