name: Coreboot Stable Release Cycle

on:
  push:
    branches:
      - main
    paths:
      - 'blobs/**'
      - 'board/**'
      - 'configs/**'
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/coreboot-release.yml'
  # Coreboot targets quarterly stable releases (YY.03 / YY.06 / YY.09 / YY.12).
  # Poll on the 1st and 15th of each month and auto-publish whenever a new YY.MM tag lands.
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:
    inputs:
      coreboot_ref:
        description: 'Coreboot git tag or commit SHA (leave blank for latest official YY.MM tag)'
        required: false
        default: ''
      release_tag:
        description: 'Release tag override (leave blank to derive v<coreboot_tag>)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: coreboot/coreboot-sdk:2026-09-27_97eb3c4d52
      options: --user root
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      coreboot_ref: ${{ steps.meta.outputs.coreboot_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure build prerequisites (liblzma-dev for iPXE)
        run: |
          if ! dpkg -s liblzma-dev >/dev/null 2>&1; then
            apt-get update && apt-get install -y --no-install-recommends liblzma-dev
          fi

      - name: Resolve target Coreboot stable tag
        id: meta
        run: |
          git config --global --add safe.directory "*"
          REF="${{ github.event.inputs.coreboot_ref }}"
          if [ -z "$REF" ]; then
            REF="$(git ls-remote --tags https://github.com/coreboot/coreboot.git \
              | grep -oE 'refs/tags/[0-9]{2}\.[0-9]{2}$' \
              | sed 's#refs/tags/##' \
              | sort -V \
              | tail -n 1)"
          fi
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${REF}"
          fi
          echo "coreboot_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved Coreboot ref=$REF, Release tag=$TAG"

      - name: Clone upstream Coreboot at target ref
        run: |
          git init coreboot
          cd coreboot
          git remote add origin https://github.com/coreboot/coreboot.git
          git fetch --depth 1 origin "${{ steps.meta.outputs.coreboot_ref }}"
          git checkout FETCH_HEAD
          git submodule update --init --checkout --depth 1 \
            3rdparty/intel-microcode \
            3rdparty/libgfxinit \
            3rdparty/libhwbase \
            3rdparty/vboot

      - name: Build & verify both 8 MiB Z97-A ROM binaries (with-me and without-me)
        env:
          ROOT_DIR: ${{ github.workspace }}
          COREBOOT_DIR: ${{ github.workspace }}/coreboot
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          OUT_DIR: ${{ github.workspace }}/release-bins
        run: |
          bash scripts/build_release_roms.sh

      - name: Upload 2 release binaries artifact
        uses: actions/upload-artifact@v7
        with:
          name: asus-z97-a-release-bins
          path: release-bins/*.bin

  publish:
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download 2 release binaries
        uses: actions/download-artifact@v8
        with:
          name: asus-z97-a-release-bins
          path: release-bins

      - name: Publish GitHub Release (2 complete 8 MiB .bin files)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ needs.build.outputs.release_tag }}
          CB_REF: ${{ needs.build.outputs.coreboot_ref }}
        run: |
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            echo "Release $REL_TAG already exists; skipping duplicate creation."
            exit 0
          fi

          COUNT="$(find release-bins -maxdepth 1 -type f -name '*.bin' | wc -l)"
          if [ "$COUNT" -ne 2 ]; then
            echo "ERROR: Expected exactly 2 .bin release files, found $COUNT" >&2
            exit 1
          fi

          export SHA_WITH="$(sha256sum "release-bins/asus-z97-a-coreboot-${REL_TAG}-with-me.bin" | awk '{print $1}')"
          export SHA_WITHOUT="$(sha256sum "release-bins/asus-z97-a-coreboot-${REL_TAG}-without-me.bin" | awk '{print $1}')"

          python3 - <<'PY' > release-notes.md
          import os
          tag = os.environ["REL_TAG"]
          ref = os.environ["CB_REF"]
          sha_w = os.environ["SHA_WITH"]
          sha_wo = os.environ["SHA_WITHOUT"]
          print(f"""## ASUS Z97-A — Coreboot + EDK2 + iPXE Release (`{tag}`)

          Automated release tracking upstream Coreboot `{ref}` (`with-me` and `without-me`).

          ### Release Binaries (Complete 8 MiB SPI Images)
          | File | Size | ME Configuration | SHA-256 |
          |---|---:|---|---|
          | `asus-z97-a-coreboot-{tag}-with-me.bin` | `8,388,608` B (`8 MiB`) | Stock Intel ME `9.1.25.1005` (`MEI #1` `00:16.0` hidden via `FD2`) + Unlocked IFD (`FLMSTR1=0xffff0000`, `BIOS@0x180000`) | `{sha_w}` |
          | `asus-z97-a-coreboot-{tag}-without-me.bin` | `8,388,608` B (`8 MiB`) | Minimal `116 KiB` ME (`me_cleaner -S -r -t`: `ROMP`+`BUP`, RSA-valid `FTPR` kept to avoid 30-min shutdown timer) + `AltMeDisable=1` + `MEI #1` hidden + Unlocked IFD (`BIOS@0x020000`, `+1.375 MiB` free BIOS flash region) | `{sha_wo}` |

          ### Default Enabled Platform Features
          - **Virtualization & PCIe:** VT-x (`VMX`/`EPT`/`VPID` unlocked-disabled/enabled locked cleanly), VT-d IOMMU (`DMAR` + IRQ remapping), `ALWAYS_ALLOW_ABOVE_4G_ALLOCATION=y`, Resizable BAR (up to `32 GiB`, Coreboot + EDK2 `PcdPcieResizableBarSupport=TRUE`), SR-IOV + ARI, `PCIEXP_ASPM=n`.
          - **Power & Remote Management:** Restore AC Power Loss = **Power ON (`S0`)** (`AFTERG3_EN=0`), **Wake-on-LAN (`S3/S4/S5`)** enabled (`GEN_PMCON_3 WOL_EN_OVRD=1`, ACPI `_PRW` on `GLAN` `00:19.0`, `PEG0..2`, `RP01..08`, S5 GPE preservation), Intel ME `00:16.0` disabled/hidden by default.
          - **Display (`libgfxinit` + Stock VBT) & Setup:** Full stock `3503` `i915_vbt.bin` (`vbt.bin` SHA-256 `ada53b3d...`) embedded in CBFS & ACPI IGD OpRegion + all 5 ports (`HDMI1`/`DP2`/`HDMI2`/`HDMI3`/`Analog`), UEFI CFR Setup (`ESC`) + UEFI Shell + `iPXE`.

          ### Direct SPI Chip Flashing & `QE=1` Note
          - Both `.bin` files include the full ASUS Z97-A descriptor (`FLCOMP=0x64900044`, `VSCC` `W25Q64`/`GD25Q64`, `PCHSTRP9=0xf0544a85`, `PCHSTRP18=0x00000003`), `GbE`, `ME`, `RW_MRC_CACHE`, `SMMSTORE`, and `COREBOOT` (`EDK2` + `iPXE`, `PCIEXP_ASPM=n`).
          - **NOTE when switching between `with-me` (`BIOS@0x180000`) and `without-me` (`BIOS@0x020000`):** These two variants use different `IFD` (`FREG1`/`FREG2`) layouts. Always flash `without-me` externally via `CH341A` (NEVER overwrite `IFD` or `ME` internally with `flashrom -p internal`).
          - **Winbond `W25Q64FV` Quad Enable (`QE=1`) Hardware Note:** `QE=1` lives in non-volatile Status Register 2 (`SR2=0x02`) outside the 8 MiB flash array. Chips pulled from an ASUS Z97-A (or `W25Q64JV-IQ`) already have `QE=1` latched and boot directly after `flashrom -w <file>.bin -v <file>.bin`. If flashing a blank `W25Q64FV` (`SR2=0x00`), run `bash scripts/flash-ch341a.sh <file>.bin` (which flashes, verifies, and sets non-volatile `SR1=0x00, SR2=0x02` in one step).
          - **GbE MAC Notice:** Replace `0x001000..0x002fff` (`FREG3`) with your board's original GbE EEPROM if needed to keep your unique onboard `I218-V` MAC address.""")
          PY

          gh release create "$REL_TAG" release-bins/*.bin \
            --title "ASUS Z97-A Coreboot ${REL_TAG} (upstream Coreboot ${CB_REF})" \
            --notes-file release-notes.md
